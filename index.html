<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f8" />

    <script>try { const t = localStorage.getItem('postpost:theme'); const dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; document.querySelector('meta[name=theme-color]')?.setAttribute('content', dark ? '#000000' : '#f8f8f8'); } catch {}</script>
    <link rel="icon" href="%BASE_URL%pulleem.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/study/palette.css" />
    <title>풀림 · 함께 푸는 학습 공간</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
