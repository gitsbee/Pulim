<header data-engine-header class="app-header">
    <div class="header-inner">
      <button class="brand" data-view="home"><span class="brand-icon" data-brand-icon aria-hidden="true"></span>풀림 영어</button>
      <nav aria-label="영어 연습 메뉴">
        <button data-view="home" aria-label="연습">연습</button>
        <button data-view="wrong" aria-label="기록">기록</button>
        <button type="button" class="plain-button settings-button" id="home-settings" data-settings aria-label="화면 및 입력 설정" title="화면 및 입력 설정"></button>
      </nav>
    </div>
  </header>
  <div id="app"></div>
  <dialog class="preferences-dialog" id="preferences" aria-labelledby="preferences-title">
    <header class="preferences-header"><h2 id="preferences-title">설정</h2>
      <form method="dialog"><button class="plain-button preferences-close" id="close-settings" aria-label="닫기"></button></form>
    </header>
    <section class="preferences-section" aria-labelledby="settings-screen">
      <h3 id="settings-screen">화면 및 테마</h3>
      <fieldset><legend class="sr-only">화면 테마</legend>
      <div class="theme-options">
        <label class="select-card"><input name="theme" type="radio" value="system"><span>시스템</span></label>
        <label class="select-card"><input name="theme" type="radio" value="light"><span>라이트</span></label>
        <label class="select-card"><input name="theme" type="radio" value="dark"><span>다크</span></label>
        <label class="select-card"><input name="theme" type="radio" value="paper"><span>종이</span></label>
      </div>
      </fieldset>
    </section>
    <section class="preferences-section" aria-labelledby="settings-input">
      <h3 id="settings-input">입력</h3>
      <label class="mix-toggle settings-toggle"><span>세벌식 390</span><input id="ime" type="checkbox" role="switch" aria-describedby="ime-help"></label>
      <p id="ime-help" class="help">세벌식 390 사용 시 물리 키보드를 영문 상태로 두세요.</p>
    </section>
    <section class="preferences-section" aria-labelledby="settings-problem"><h3 id="settings-problem">문제 설정</h3>
      <label class="mix-toggle settings-toggle"><span>범위 수동 설정</span><input id="manual-setting" type="checkbox" role="switch"></label>
    </section>
    <section class="preferences-section" aria-labelledby="settings-sound"><h3 id="settings-sound">음향 및 소리</h3>
      <label class="mix-toggle settings-toggle"><span>효과음</span><input id="sound-enabled" type="checkbox" role="switch"></label>
      <div class="volume-setting"><label for="sound-volume">효과음 음량</label><output id="sound-volume-value" for="sound-volume">70%</output><span class="range-track"><input id="sound-volume" type="range" min="0" max="100" step="5"></span></div>
    </section>
    <section class="preferences-section" aria-labelledby="settings-support"><h3 id="settings-support">사용자 지원</h3>
      <div class="support-links"><button type="button" data-support="help" class="button secondary"><span data-icon="book"></span>도움말</button>
      <button type="button" data-support="about" class="button secondary"><span data-icon="logo"></span>소개</button></div>
    </section>
  </dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <h2 id="reset-title">학습 기록을 초기화할까요?</h2>
    <p>학습 현황, 오답, 힌트 정답, 북마크, 인정 답안과 진행 중인 학습이 이 브라우저에서 삭제됩니다.</p>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" value="cancel" autofocus><span class="icon-slot" data-icon="close"></span>취소</button>
      <button class="button danger" value="reset"><span class="icon-slot" data-icon="trash"></span>기록 초기화</button>
    </form>
  </dialog>
  <dialog id="segment-reset-dialog" aria-labelledby="segment-reset-title"><h2 id="segment-reset-title">이 구간의 학습을 초기화할까요?</h2><p>선택한 학습 방식과 범위의 진행 상태가 초기화됩니다. 다른 학습 기록과 북마크는 유지됩니다.</p><form method="dialog" class="dialog-actions"><button class="button secondary" value="cancel" autofocus>취소</button><button class="button danger" value="reset">구간 초기화</button></form></dialog>
  <dialog id="replace-round" aria-labelledby="replace-title">
    <h2 id="replace-title">새 학습을 시작할까요?</h2>
    <p>같은 방식의 진행 중인 학습을 새로 시작합니다.</p>
    <form method="dialog" class="dialog-actions">
      <button class="button secondary" value="cancel" autofocus><span class="icon-slot" data-icon="close"></span>취소</button>
      <button class="button primary action-start" value="replace">새 학습 시작</button>
    </form>
  </dialog>
